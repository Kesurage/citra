name: build-g100

on:
  push:
    branches: [ g100 ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25b

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate keystore
        working-directory: src/android
        run: |
          keytool -genkeypair -v -keystore g100.jks -alias g100 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass g100pass -keypass g100pass \
            -dname "CN=MH4U G100, OU=Preservation, O=Kesurage, L=NA, S=NA, C=US"

      - name: Build APK
        working-directory: src/android
        env:
          KS_FILE: g100.jks
          KS_ALIAS: g100
          KS_PASS: g100pass
        run: |
          echo "ndk.dir=${{ steps.ndk.outputs.ndk-path }}" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          # G100: MMJ jni_common.cpp already provides cubeb JNI symbols (path is repo root, cwd is src/android)
          sed -i 's|src/cubeb-jni.cpp)|)|' ../../externals/cubeb/CMakeLists.txt
          # G100: MMJ jni_common.cpp already provides cubeb JNI symbols
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mh4u-g100-apk
          path: src/android/app/build/outputs/apk/release/*.apk
